<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Ciudad Líquida</title>
<!-- Enlace obligatorio al Manifiesto de la PWA -->
<link rel="manifest" href="manifest.json">
<!-- Meta etiqueta para el color de barra en móviles -->
<meta name="theme-color" content="#141e30">
<!-- Soporte para accesos directos en iOS (Apple) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=192&h=192&q=80">

<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0; background: #0b0f19;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
}

/* Envoltura general de la pantalla PWA (Súper compacta, evita recortes) */
.pwa-layout {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 440px;
  padding: 16px;
}

/* Diseño idéntico al reproductor oficial del PDF */
.player-container {
  display: flex;
  align-items: center;
  background: linear-gradient(135deg, #141e30, #243b55);
  border-radius: 25px; padding: 6px 16px;
  width: 100%;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1); height: 54px;
}
.info-station {
  flex-grow: 1; color: #ffffff; display: flex;
  align-items: center; justify-content: flex-start; min-width: 0;
}
.text-container {
  display: flex; flex-direction: column; justify-content: center;
  align-items: flex-start; line-height: 1.2; min-width: 0;
}
.text-container .line1 {
  font-size: 10px; font-weight: 300; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px;
}
.text-container .line2 {
  font-size: 13px; font-weight: 300; color: #ffffff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px;
}
.live-indicator {
  display: inline-block; width: 7px; height: 7px; background-color: #ff3b30;
  border-radius: 50%; margin-right: 12px; animation: blink 1.5s infinite; flex-shrink: 0;
}
.controls-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.audio-wave { display: flex; align-items: flex-end; gap: 3px; width: 25px; height: 16px; }
.audio-wave span { display: block; width: 3px; background-color: #00ffcc; border-radius: 2px; height: 4px; }
.audio-wave.moving span:nth-child(1) { animation: bounce 0.6s infinite alternate; }
.audio-wave.moving span:nth-child(2) { animation: bounce 0.9s infinite alternate 0.1s; }
.audio-wave.moving span:nth-child(3) { animation: bounce 0.7s infinite alternate 0.2s; }
.audio-wave.moving span:nth-child(4) { animation: bounce 0.5s infinite alternate 0.3s; }
.volume-container { display: flex; align-items: center; gap: 5px; }
.volume-slider { -webkit-appearance: none; width: 55px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
.volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #00ffcc; cursor: pointer; }
.mute-btn { background: transparent; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
.mute-btn svg { width: 14px; height: 14px; fill: #ffffff; transition: fill 0.2s; opacity: 0.8; }
.mute-btn:hover svg { fill: #00ffcc; }
.play-btn {
  background: #00ffcc; border: none; width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer; display: flex; justify-content: center; align-items: center;
  box-shadow: 0 0 10px rgba(0, 255, 210, 0.4); flex-shrink: 0;
}
.play-btn svg { width: 14px; height: 14px; fill: #141e30; }
.hidden-audio-box { display: none !important; }

@keyframes bounce { 100% { height: 16px; } }
@keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
</style>
</head>
<body>

<div class="pwa-layout">
  <!-- REPRODUCTOR ORIGINAL COMPLETO (SIN BOTONES EXTRA NI RECORTES) -->
  <div class="player-container">
    <div class="info-station">
      <span class="live-indicator"></span>
      <div class="text-container">
        <span class="line1">Radio</span>
        <span class="line2">Ciudad Líquida</span>
      </div>
    </div>
    <div class="controls-right">
      <div class="audio-wave" id="visualEqualizer">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="volume-container">
        <button class="mute-btn" onclick="toggleMute()" id="muteToggle">
          <svg id="unmuteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="muteIcon" viewBox="0 0 24 24" style="display:none;"><path d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volumeControl" min="0" max="1" step="0.1" value="0.8" oninput="changeVolume(this.value)">
      </div>
      <button class="play-btn" onclick="togglePlayback()">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="hidden-audio-box">
<audio id="audioInstance"></audio>
</div>

<script>
const audio = document.getElementById('audioInstance');
const unmuteIcon = document.getElementById('unmuteIcon');
const muteIcon = document.getElementById('muteIcon');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const equalizer = document.getElementById('visualEqualizer');

const streamTarget = "https://ssl.listen2myradio.com/listen.php?ip=212.84.160.3&port=7041&type=s2"; 

let isPlaying = false; 
let currentVolume = 0.8;
audio.volume = 0.8;

// 1. REGISTRO DEL SERVICE WORKER (Para activar la PWA e instalación)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('PWA: Service Worker registrado con éxito', reg))
      .catch(err => console.error('PWA: Error al registrar el Service Worker', err));
  });
}

// 2. MEDIA SESSION API (Para el control en segundo plano y pantalla de bloqueo)
function updateMediaSession() {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Ciudad Líquida',
      artist: 'Radio Online',
      album: 'Emisión en Vivo',
      artwork: [
        { src: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=512&h=512&q=80', sizes: '512x512', type: 'image/jpeg' }
      ]
    });

    navigator.mediaSession.setActionHandler('play', () => {
      if (!isPlaying) togglePlayback();
    });
    navigator.mediaSession.setActionHandler('pause', () => {
      if (isPlaying) togglePlayback();
    });
  }
}

// 3. MONITOR CONTRA CONGELAMIENTO (Evita que el sistema apague el flujo)
audio.addEventListener('stalled', () => {
  if (isPlaying) {
    console.log("Se detectó un corte de red. Reconectando...");
    reconectarStream();
  }
});

function reconectarStream() {
  const separator = streamTarget.includes('?') ? '&' : '?';
  audio.src = streamTarget + separator + "t=" + Date.now();
  audio.play().catch(err => console.log("Reconexión aplazada por el OS"));
}

function togglePlayback() {
  if (!isPlaying) {
    const separator = streamTarget.includes('?') ? '&' : '?';
    audio.src = streamTarget + separator + "t=" + Date.now();
    
    audio.play().then(() => {
      isPlaying = true;
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      if (currentVolume > 0 && !audio.muted) {
        equalizer.classList.add('moving');
      }
      
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = "playing";
        updateMediaSession();
      }

      // =======================================================================
      // DETECTOR INTELIGENTE HÍBRIDO (TÚ GRÁN SOLUCIÓN MATEMÁTICA DE ENTORNOS)
      // =======================================================================
      // Verificamos si estamos dentro de la App APK (WebView) o PWA Standalone
      const isInstalledApp = window.matchMedia('(display-mode: standalone)').matches || 
                             /wv/i.test(navigator.userAgent) || 
                             (navigator.userAgent.includes('Android') && navigator.userAgent.includes('Version/'));

      if (!isInstalledApp) {
        // EN LA WEB (PC, Chrome, Safari móvil): Auto-abre Google Sites en una pestaña nueva
        setTimeout(() => {
          window.open("https://sites.google.com/view/radiociudadliquida/inicio", "_blank");
        }, 300);
      } else {
        // EN LA APP APK: Se mantiene puro, liviano y sonando estable en segundo plano
        console.log("Modo APK Detectado: Reproducción de audio pura activada sin redirección.");
      }
      // =======================================================================

    }).catch(err => {
      console.error("Error al reproducir:", err);
      alert("No se pudo conectar con la emisora. Asegúrate de estar transmitiendo.");
    });
  } else {
    audio.pause();
    audio.src = '';
    audio.load();
    isPlaying = false;
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
    equalizer.classList.remove('moving');
    
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = "paused";
    }
  }
}

function toggleMute() {
  if (audio.muted) {
    audio.muted = false;
    unmuteIcon.style.display = 'block';
    muteIcon.style.display = 'none';
    if (currentVolume > 0 && isPlaying) equalizer.classList.add('moving');
  } else {
    audio.muted = true;
    unmuteIcon.style.display = 'none';
    muteIcon.style.display = 'block';
    equalizer.classList.remove('moving');
  }
}

function changeVolume(val) {
  currentVolume = parseFloat(val);
  audio.volume = currentVolume;
  if (currentVolume > 0 && audio.muted) {
    audio.muted = false;
    unmuteIcon.style.display = 'block';
    muteIcon.style.display = 'none';
  }
  if (currentVolume === 0 || audio.muted || !isPlaying) {
    equalizer.classList.remove('moving');
  } else {
    equalizer.classList.add('moving');
  }
}
</script>
</body>
</html>
